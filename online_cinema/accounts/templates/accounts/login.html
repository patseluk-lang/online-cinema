{% extends "movies/base.html" %}
{% block title %}Вхід - Online Cinema{% endblock %}
{% block content %}
<section class="auth-box">
    <div class="auth-header">
        <h1>Вхід 🎬</h1>
        <p>Увійдіть до свого акаунта</p>
    </div>

    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <p>
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus>
        </p>
        <p>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
        </p>
        <button type="submit" class="button">Увійти</button>
    </form>

    <p>Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
</section>
{% endblock %}
